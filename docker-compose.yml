services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ARTEFACTS_ROOT=/app/artefacts
      - PYTHONPATH=/app/backend
    volumes:
      - ./artefacts:/app/artefacts:ro
      - ./finaccess_coping_workbench/outputs/prepared:/app/finaccess_coping_workbench/outputs/prepared:ro
      - ./knowledge_base:/app/knowledge_base:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
