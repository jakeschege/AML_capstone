name: API tests

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  pytest-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Ensure artefacts exist
        run: |
          if [ ! -f artefacts/classifier/v0.1.0/model.joblib ]; then
            python backend/scripts/export_classifier_v010.py
            python backend/scripts/export_segmentation_v010.py
            python backend/scripts/export_shap_v010.py
          fi
      - name: Run API tests
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests
